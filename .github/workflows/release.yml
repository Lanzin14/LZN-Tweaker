# Publica uma versão do LZN Tweaker quando uma tag vX.Y.Z é enviada (ex.: git tag v1.0.0 && git push origin v1.0.0).
# A Release recebe o .exe único (com o .NET embutido), o SHA-256 que o install.ps1 confere, o próprio install.ps1
# e as licenças de terceiros. É o que o comando "irm https://lanzin14.github.io/win | iex" baixa.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write      # criar a Release
  id-token: write      # identidade OIDC do workflow para assinar a atestação
  attestations: write  # gravar a atestação de origem do .exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions fixadas por hash de commit (uma tag pode ser movida; o hash não). O Dependabot atualiza os dois.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Testes do núcleo
        shell: pwsh
        run: ./tools/ci/test-core.ps1

      - name: Dependências com vulnerabilidade conhecida
        shell: pwsh
        run: ./tools/ci/check-vulnerable.ps1

      - name: Publicar o .exe único
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/LznTweaker.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$version -o publish

      - name: Montar os arquivos da Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item publish/LznTweaker.exe release/
          $hash = (Get-FileHash release/LznTweaker.exe -Algorithm SHA256).Hash
          Set-Content release/LznTweaker.exe.sha256 "$hash  LznTweaker.exe" -Encoding ascii -NoNewline
          Copy-Item install.ps1 release/
          # Licenças que acompanham o binário: fontes (OFL) e perfis do Deadlock (GPL-3.0, com as fontes em FONTES.md).
          Compress-Archive -Path publish/Licenses, publish/Assets -DestinationPath release/LznTweaker-licencas.zip
          Get-ChildItem release | Format-Table Name, Length

      # Prova assinada (Sigstore) de que este .exe foi gerado por este workflow, a partir deste commit do repositório.
      # O SHA-256 publicado só detecta arquivo corrompido; a atestação também detecta um .exe trocado na Release.
      # Verificar: gh attestation verify LznTweaker.exe --repo Lanzin14/LZN-Tweaker
      - name: Atestar a origem do .exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/LznTweaker.exe

      - name: Criar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-Content release/LznTweaker.exe.sha256 -Raw).Split(' ')[0]
          $notes = @"
          Para abrir, cole no PowerShell:

          ``````powershell
          irm https://lanzin14.github.io/win | iex
          ``````

          Ou baixe o LznTweaker.exe abaixo. SHA-256: ``$hash``

          Para confirmar que o .exe saiu deste repositório pelo GitHub Actions (com a [CLI do GitHub](https://cli.github.com)):

          ``````powershell
          gh attestation verify LznTweaker.exe --repo Lanzin14/LZN-Tweaker
          ``````
          "@
          gh release create '${{ github.ref_name }}' (Get-ChildItem release).FullName --title "LZN Tweaker ${{ github.ref_name }}" --notes $notes
