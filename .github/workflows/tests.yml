# Testes do núcleo a cada envio de branch, sem publicar nada. Falhas aparecem como anotações na página da execução.
name: Testes

on:
  push:
    branches: ['**']

# O token só lê o repositório: este workflow não publica nada.
permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      # Actions fixadas por hash de commit (uma tag pode ser movida; o hash não). O Dependabot atualiza os dois.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Testes do núcleo
        shell: pwsh
        run: ./tools/ci/test-core.ps1

      - name: Dependências com vulnerabilidade conhecida
        shell: pwsh
        run: ./tools/ci/check-vulnerable.ps1
